<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112" width="64" height="112">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B3121A"/>
      <stop offset="0.5" stop-color="#E63946"/>
      <stop offset="1" stop-color="#B3121A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#0a0d15"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="32" cy="102" rx="26" ry="6" fill="url(#shadow)"/>

  <!-- body silhouette with rounded ends -->
  <path d="M14 20
           C14 10, 22 4, 32 4
           C42 4, 50 10, 50 20
           L50 90
           C50 100, 42 106, 32 106
           C22 106, 14 100, 14 90 Z"
        fill="url(#body)" stroke="#3a0508" stroke-width="1.4"/>

  <!-- highlight strip -->
  <path d="M18 22 C18 14, 24 8, 32 8 C40 8, 46 14, 46 22 L46 88 C46 96, 40 102, 32 102 C24 102, 18 96, 18 90 Z"
        fill="none" stroke="#ff6b73" stroke-opacity="0.35" stroke-width="1"/>

  <!-- headlights -->
  <ellipse cx="21" cy="12" rx="3.2" ry="2.2" fill="#fff8dc" stroke="#3a0508" stroke-width="0.6"/>
  <ellipse cx="43" cy="12" rx="3.2" ry="2.2" fill="#fff8dc" stroke="#3a0508" stroke-width="0.6"/>

  <!-- taillights -->
  <rect x="17" y="94" width="8" height="4" rx="1.2" fill="#3a0508"/>
  <rect x="39" y="94" width="8" height="4" rx="1.2" fill="#3a0508"/>
  <rect x="18" y="95" width="6" height="2" rx="0.6" fill="#ffb347"/>
  <rect x="40" y="95" width="6" height="2" rx="0.6" fill="#ffb347"/>

  <!-- side mirrors -->
  <ellipse cx="12" cy="34" rx="3" ry="2" fill="#8a0a12" stroke="#3a0508" stroke-width="0.6"/>
  <ellipse cx="52" cy="34" rx="3" ry="2" fill="#8a0a12" stroke="#3a0508" stroke-width="0.6"/>

  <!-- windshield (front) -->
  <path d="M19 28 L45 28 L42 44 L22 44 Z" fill="url(#glass)" stroke="#0a0d15" stroke-width="1"/>
  <!-- roof -->
  <rect x="20" y="44" width="24" height="26" fill="#7a0a10" stroke="#0a0d15" stroke-width="0.8"/>
  <!-- rear windshield -->
  <path d="M22 70 L42 70 L45 84 L19 84 Z" fill="url(#glass)" stroke="#0a0d15" stroke-width="1"/>

  <!-- roof highlight -->
  <rect x="22" y="46" width="20" height="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- door lines -->
  <line x1="14" y1="56" x2="20" y2="56" stroke="#3a0508" stroke-width="0.8"/>
  <line x1="44" y1="56" x2="50" y2="56" stroke="#3a0508" stroke-width="0.8"/>
</svg>
