apply plugin: 'com.android.application'

def apoisVersionCode = (project.findProperty('APOIS_VERSION_CODE') ?: System.getenv('APOIS_VERSION_CODE') ?: '1').toString().toInteger()
def apoisVersionName = (project.findProperty('APOIS_VERSION_NAME') ?: System.getenv('APOIS_VERSION_NAME') ?: '1.0').toString()
def uploadStoreFilePath = project.findProperty('APOIS_UPLOAD_KEYSTORE_PATH') ?: System.getenv('APOIS_UPLOAD_KEYSTORE_PATH')
def uploadKeyAlias = project.findProperty('APOIS_UPLOAD_KEY_ALIAS') ?: System.getenv('APOIS_UPLOAD_KEY_ALIAS')
def uploadStorePassword = project.findProperty('APOIS_UPLOAD_STORE_PASSWORD') ?: System.getenv('APOIS_UPLOAD_STORE_PASSWORD')
def uploadKeyPassword = project.findProperty('APOIS_UPLOAD_KEY_PASSWORD') ?: System.getenv('APOIS_UPLOAD_KEY_PASSWORD')
def uploadSigningReady = [uploadStoreFilePath, uploadKeyAlias, uploadStorePassword, uploadKeyPassword].every {
    it != null && !it.toString().trim().isEmpty()
}

android {
    namespace = "com.apois.motorista"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        if (uploadSigningReady) {
            release {
                storeFile file(uploadStoreFilePath.toString())
                storePassword uploadStorePassword.toString()
                keyAlias uploadKeyAlias.toString()
                keyPassword uploadKeyPassword.toString()
            }
        }
    }

    defaultConfig {
        applicationId "com.apois.motorista"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode apoisVersionCode
        versionName apoisVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".hml"
            versionNameSuffix "-hml"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (uploadSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// HML pilot: no Firebase project is authorized for device registration yet.
// Do not process the tracked production google-services.json on this branch.
logger.lifecycle("APOIS HML: Firebase push disabled for isolated pilot")
