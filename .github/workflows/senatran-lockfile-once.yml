name: One-time SENATRAN dependency lock refresh
on:
  push:
    branches:
      - security/senatran-admin-mfa-20261123

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: "!contains(github.event.head_commit.message, 'chore(lock): secure TanStack dependencies')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Resolve the patched dependency and update lockfile
        run: bun install --lockfile-only
      - name: Check the pinned patched version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const lock = readFileSync("bun.lock", "utf8");
            if (!lock.includes("@tanstack/react-start@1.168.60")) {
              console.error("Patched TanStack Start version is missing from bun.lock");
              process.exit(1);
            }
          '
      - name: Commit regenerated lockfile to this security branch only
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "No lockfile change"
            exit 0
          fi
          git commit -m "chore(lock): secure TanStack dependencies"
          git push origin HEAD:security/senatran-admin-mfa-20261123
