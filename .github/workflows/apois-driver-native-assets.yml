name: APOIS Motorista - assets nativos

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-driver-native-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Gerar ícones e splash com a marca oficial
        run: python scripts/generate-apois-native-assets.py

      - name: Commit dos assets binários
        run: |
          git config user.name "APOIS CI"
          git config user.email "actions@users.noreply.github.com"
          git add android-motorista/app/src/main/res
          if git diff --cached --quiet; then
            echo "Assets nativos já atualizados"
            exit 0
          fi
          git commit -m "feat(motorista): aplicar ícone e splash oficiais APOIS"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
