name: APOIS Motorista - APK homologação

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-driver-apk-homologacao.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidato final
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build e sync do APOIS Motorista
        run: npm run android:motorista

      - name: Verificação nativa após sync
        run: node scripts/verify-mobile-native.mjs motorista --live

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Validar APK gerado
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk APOIS-Motorista-Homologacao.apk
          ls -lh APOIS-Motorista-Homologacao.apk

      - name: Publicar APK de homologação
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Motorista-Homologacao
          path: APOIS-Motorista-Homologacao.apk
          if-no-files-found: error
          retention-days: 7
