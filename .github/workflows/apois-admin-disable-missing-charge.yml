name: APOIS Admin - remover cobrança sem backend

on:
  push:
    branches:
      - feat/apois-admin-supabase-oficial-homologacao
    paths:
      - ".github/workflows/apois-admin-disable-missing-charge.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-admin-supabase-oficial-homologacao

      - name: Remover ação de cobrança sem Edge Function oficial
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/admin.motoristas.tsx')
          text = path.read_text(encoding='utf-8')

          start = text.find('async function regenerateDriverCharge(')
          if start != -1:
              end = text.find('\nfunction AdminMotoristas()', start)
              if end == -1:
                  raise SystemExit('fim de regenerateDriverCharge não encontrado')
              text = text[:start] + text[end + 1:]

          start = text.find('  async function generateCharge(d: Driver) {')
          if start != -1:
              end = text.find('\n  return (', start)
              if end == -1:
                  raise SystemExit('fim de generateCharge não encontrado')
              text = text[:start] + text[end:]

          text = text.replace('              onGenerateCharge={() => generateCharge(d)}\n', '')
          text = text.replace('  onGenerateCharge,\n', '')
          text = text.replace('  onGenerateCharge: () => void;\n', '')

          charge_button = '''          {driver.approval_status === "aprovado" && (\n            <Button size="sm" variant="outline" onClick={onGenerateCharge} disabled={busy}>\n              {busy ? <Loader2 className="mr-1 h-4 w-4 animate-spin" /> : <CreditCard className="mr-1 h-4 w-4" />} Cobrança\n            </Button>\n          )}\n'''
          text = text.replace(charge_button, '')

          forbidden = [
              'regenerate-driver-mercadopago-charge',
              'regenerateDriverCharge',
              'generateCharge(',
              'onGenerateCharge',
              '> Cobrança',
          ]
          leftovers = [item for item in forbidden if item in text]
          if leftovers:
              raise SystemExit('referências de cobrança antiga ainda presentes: ' + ', '.join(leftovers))
          if 'onSubscription' not in text:
              raise SystemExit('gestão administrativa de status da assinatura foi removvida indevidamente')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar
        run: |
          ! grep -F 'regenerate-driver-mercadopago-charge' src/routes/admin.motoristas.tsx
          ! grep -F 'onGenerateCharge' src/routes/admin.motoristas.tsx
          grep -F 'onSubscription' src/routes/admin.motoristas.tsx
          grep -F 'updateApprovalFn({' src/routes/admin.motoristas.tsx

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.motoristas.tsx
          git commit -m "fix(admin): ocultar cobrança sem backend oficial"
          git push origin HEAD:feat/apois-admin-supabase-oficial-homologacao
