name: APOIS Corridas — Core Ride validation

on:
  push:
    branches:
      - fix/apois-corridas-consolidacao
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/passenger-ride-request/**"
      - "tests/unit/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/apois-core-ride-validate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/passenger-ride-request/**"
      - "tests/unit/**"
      - "src/**"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Deno check Edge request
        run: deno check supabase/functions/passenger-ride-request/index.ts

      - name: Build web
        run: npm run build

      - name: Core invariants
        run: |
          set -euo pipefail
          grep -F 'totalCents' supabase/functions/_shared/fare-engine.ts
          grep -F 'canTransitionRide' supabase/functions/_shared/ride-state.ts
          grep -F 'MAX_INTERMEDIATES = 3' supabase/functions/_shared/ride-request.ts
          grep -F 'payment_method_required' supabase/functions/_shared/ride-request.ts
          grep -F 'parseRideRequest(rawBody)' supabase/functions/passenger-ride-request/index.ts
          grep -F 'fare.totalCents' supabase/functions/passenger-ride-request/index.ts
          grep -F 'expired' tests/unit/ride-state.test.ts
          echo 'APOIS_CORE_RIDE_OK'
