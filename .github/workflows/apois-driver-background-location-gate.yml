name: APOIS Corridas — Driver Background Location Gate

on:
  push:
    branches:
      - tooling/apois-driver-background-location-gate

permissions:
  contents: read

jobs:
  validate-driver-background-location:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Phase 9 Driver contract
        run: node tests/mobile/driver-phase9-contract.mjs

      - name: TypeScript — Driver surface
        run: npx tsc --noEmit --project tsconfig.driver-phase7.json

      - name: ESLint — background location wiring
        run: |
          npx eslint --rule "prettier/prettier: off" \
            src/lib/driverBackgroundLocation.ts \
            src/hooks/useDriverBroadcast.ts

      - name: Prepare Firebase Driver client
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.APOIS_MOTORISTA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -f android-motorista/app/google-services.json ]; then
            echo '[firebase] using checked-in APOIS Driver config'
          elif [ -n "$FIREBASE_CONFIG_B64" ]; then
            printf '%s' "$FIREBASE_CONFIG_B64" | base64 --decode > android-motorista/app/google-services.json
            echo '[firebase] using repository secret fallback'
          else
            echo 'Firebase client for com.apois.motorista is required.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('android-motorista/app/google-services.json', 'utf8'));
          const packages = (config?.client ?? []).map((client) => String(client?.client_info?.android_client_info?.package_name ?? '').trim());
          if (!packages.includes('com.apois.motorista')) throw new Error(`Firebase client missing com.apois.motorista: ${packages.join(', ')}`);
          console.log('[firebase] com.apois.motorista OK');
          NODE

      - name: Build and sync APOIS Driver
        env:
          VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.APOIS_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_ENABLE_NATIVE_PUSH: "true"
        run: |
          set -euo pipefail
          test -n "$VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY"
          npm run android:motorista

      - name: Verify native Driver shell
        run: node scripts/verify-mobile-native.mjs motorista --live

      - name: Background-location wiring hard gate
        run: |
          set -euo pipefail
          grep -F 'registerPlugin<DriverLocationPlugin>("DriverLocation")' src/lib/driverBackgroundLocation.ts
          grep -F 'supabase.auth.getSession()' src/lib/driverBackgroundLocation.ts
          grep -F 'startDriverBackgroundLocation()' src/hooks/useDriverBroadcast.ts
          grep -F 'stopDriverBackgroundLocation()' src/hooks/useDriverBroadcast.ts
          grep -F 'document.visibilityState !== "visible"' src/hooks/useDriverBroadcast.ts
          grep -F 'registerPlugin(DriverLocationPlugin.class)' android-motorista/app/src/main/java/com/apois/motorista/MainActivity.java
          grep -F 'ContextCompat.startForegroundService' android-motorista/app/src/main/java/com/apois/motorista/DriverLocationPlugin.java
          grep -F 'FOREGROUND_SERVICE_TYPE_LOCATION' android-motorista/app/src/main/java/com/apois/motorista/DriverLocationService.java
          grep -F 'driver_set_presence' android-motorista/app/src/main/java/com/apois/motorista/DriverLocationService.java
          echo 'APOIS_DRIVER_BACKGROUND_LOCATION_WIRING_OK'

      - name: Build Driver debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Driver-Background-Location-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
