name: APOIS Motorista - retorno status

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-motorista-status-back-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao
      - name: Adicionar botão voltar no status
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/motorista.status.tsx')
          s=p.read_text()
          if 'ArrowLeft,' not in s:
            s=s.replace('  BadgeCheck,\n', '  ArrowLeft,\n  BadgeCheck,\n', 1)
          old='''        <div className="mx-auto flex max-w-xl items-center justify-between gap-4">\n          <MovviLogo size={54} />'''
          new='''        <div className="mx-auto flex max-w-xl items-center justify-between gap-3">\n          <div className="flex items-center gap-2">\n            <button\n              type="button"\n              aria-label="Voltar"\n              onClick={() => {\n                if (window.history.length > 1) window.history.back();\n                else void navigate({ to: "/motorista/login" });\n              }}\n              className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl border border-white/8 bg-[#111315] text-white active:scale-95"\n            >\n              <ArrowLeft className="h-5 w-5" />\n            </button>\n            <MovviLogo size={48} />\n          </div>'''
          if 'aria-label="Voltar"' not in s:
            if old not in s: raise RuntimeError('header de status nao encontrado')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validar
        run: |
          grep -F 'aria-label="Voltar"' src/routes/motorista.status.tsx
          grep -F 'window.history.back()' src/routes/motorista.status.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/motorista.status.tsx
          git commit -m "fix(motorista): permitir voltar da tela de status"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
