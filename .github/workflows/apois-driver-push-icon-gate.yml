name: APOIS Corridas — Driver Push Icon Gate

on:
  push:
    branches:
      - tooling/apois-driver-push-icon-gate

permissions:
  contents: read

jobs:
  validate-driver-push-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Phase 9 Driver contract
        run: node tests/mobile/driver-phase9-contract.mjs

      - name: Prepare Firebase Driver client
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.APOIS_MOTORISTA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -f android-motorista/app/google-services.json ]; then
            echo '[firebase] using checked-in APOIS Driver config'
          elif [ -n "$FIREBASE_CONFIG_B64" ]; then
            printf '%s' "$FIREBASE_CONFIG_B64" | base64 --decode > android-motorista/app/google-services.json
          else
            echo 'Firebase client for com.apois.motorista is required.'
            exit 1
          fi

      - name: Build and sync APOIS Driver
        env:
          VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.APOIS_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_ENABLE_NATIVE_PUSH: "true"
        run: |
          set -euo pipefail
          test -n "$VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY"
          npm run android:motorista

      - name: Native push icon hard gate
        run: |
          set -euo pipefail
          test -f android/app/src/main/res/drawable/ic_stat_apois_notification.xml
          grep -F 'com.google.firebase.messaging.default_notification_icon' android/app/src/main/AndroidManifest.xml
          grep -F '@drawable/ic_stat_apois_notification' android/app/src/main/AndroidManifest.xml
          grep -F 'android:fillColor="#FFFFFFFF"' android/app/src/main/res/drawable/ic_stat_apois_notification.xml
          echo 'APOIS_DRIVER_PUSH_ICON_OK'

      - name: Build Driver debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Driver-Push-Icon-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
