name: APOIS Motorista - id estatisticas

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-motorista-stats-id-clarity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao
      - name: Renomear parâmetro para drivers.id
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/motorista.app.tsx')
          s=p.read_text()
          s=s.replace('const loadTodayStats = useCallback(async (uid: string) => {','const loadTodayStats = useCallback(async (driverRecordId: string) => {',1)
          s=s.replace('.eq("driver_id", uid).eq("status", "finalizada")','.eq("driver_id", driverRecordId).eq("status", "finalizada")',1)
          p.write_text(s)
          PY
      - name: Validar
        run: |
          grep -F 'driverRecordId' src/routes/motorista.app.tsx
          if grep -F '.eq("driver_id", uid)' src/routes/motorista.app.tsx; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/motorista.app.tsx
          git commit -m "refactor(motorista): explicitar drivers.id nas estatísticas"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
