name: APOIS Motorista — Play Store AAB

on:
  push:
    branches:
      - release/playstore-motorista-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apois-playstore-motorista-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-playstore-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APOIS_UPLOAD_KEY_ALIAS: ${{ secrets.APOIS_UPLOAD_KEY_ALIAS }}
      APOIS_UPLOAD_STORE_PASSWORD: ${{ secrets.APOIS_UPLOAD_STORE_PASSWORD }}
      APOIS_UPLOAD_KEY_PASSWORD: ${{ secrets.APOIS_UPLOAD_KEY_PASSWORD }}
      VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.APOIS_GOOGLE_MAPS_BROWSER_KEY }}
      VITE_ENABLE_NATIVE_PUSH: "true"

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Driver release contract
        run: node tests/mobile/driver-phase9-contract.mjs

      - name: Require Play upload signing key
        env:
          APOIS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.APOIS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APOIS_UPLOAD_KEYSTORE_BASE64" || { echo 'Missing APOIS_UPLOAD_KEYSTORE_BASE64'; exit 1; }
          test -n "$APOIS_UPLOAD_KEY_ALIAS" || { echo 'Missing APOIS_UPLOAD_KEY_ALIAS'; exit 1; }
          test -n "$APOIS_UPLOAD_STORE_PASSWORD" || { echo 'Missing APOIS_UPLOAD_STORE_PASSWORD'; exit 1; }
          test -n "$APOIS_UPLOAD_KEY_PASSWORD" || { echo 'Missing APOIS_UPLOAD_KEY_PASSWORD'; exit 1; }
          printf '%s' "$APOIS_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apois-upload.jks"
          chmod 600 "$RUNNER_TEMP/apois-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/apois-upload.jks" -storepass "$APOIS_UPLOAD_STORE_PASSWORD" -alias "$APOIS_UPLOAD_KEY_ALIAS" >/dev/null
          printf 'APOIS_UPLOAD_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/apois-upload.jks" >> "$GITHUB_ENV"

      - name: Validate Play Store package and target API
        run: |
          set -euo pipefail
          grep -F 'appId: "com.apois.motorista"' capacitor.motorista.config.ts
          grep -E 'targetSdkVersion\s*=\s*36\b' android-motorista/variables.gradle
          grep -F 'applicationId "com.apois.motorista"' android-motorista/app/build.gradle
          test -f android-motorista/app/google-services.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('android-motorista/app/google-services.json', 'utf8'));
          const packages = (config?.client ?? []).map((client) => String(client?.client_info?.android_client_info?.package_name ?? '').trim());
          if (!packages.includes('com.apois.motorista')) throw new Error(`Firebase client missing com.apois.motorista: ${packages.join(', ')}`);
          console.log('APOIS_MOTORISTA_PACKAGE_AND_FIREBASE_OK');
          NODE

      - name: Build and sync Motorista native project
        run: |
          set -euo pipefail
          test -n "$VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY" || { echo 'Missing APOIS_GOOGLE_MAPS_BROWSER_KEY'; exit 1; }
          npm run android:motorista
          node scripts/verify-mobile-native.mjs motorista --live

      - name: Verify release manifest
        run: |
          set -euo pipefail
          grep -F 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.FOREGROUND_SERVICE_LOCATION' android/app/src/main/AndroidManifest.xml
          echo 'APOIS_MOTORISTA_MANIFEST_OK'

      - name: Set Play Store version
        run: |
          set -euo pipefail
          echo "APOIS_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APOIS_VERSION_NAME=1.0.0" >> "$GITHUB_ENV"

      - name: Build signed Play Store AAB
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify AAB signature
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/apois-motorista-aab-signature.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/apois-motorista-aab-signature.txt"
          sha256sum "$AAB" | tee "$RUNNER_TEMP/APOIS-Motorista-PlayStore.sha256"

      - name: Stage Play Store artifact
        run: |
          set -euo pipefail
          mkdir -p playstore-output
          cp android/app/build/outputs/bundle/release/app-release.aab playstore-output/APOIS-Motorista-v1.0.0.aab
          cp "$RUNNER_TEMP/APOIS-Motorista-PlayStore.sha256" playstore-output/APOIS-Motorista-v1.0.0.sha256

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Motorista-PlayStore-AAB-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: playstore-output/
