name: APOIS Admin - corrigir estado motorista

on:
  push:
    branches:
      - feat/apois-admin-supabase-oficial-homologacao
    paths:
      - ".github/workflows/apois-admin-driver-state-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-admin-supabase-oficial-homologacao

      - name: Corrigir chave da corrida e documentos obrigatórios
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/admin.motoristas.tsx')
          text = path.read_text(encoding='utf-8')

          old_docs = '  return !d.selfie_url || !d.cnh_url || !d.cnh_back_url || !d.vehicle_document_url || !d.vehicle_photo_url;'
          new_docs = '  return !d.selfie_url || !d.cnh_url || !d.cnh_back_url || !d.vehicle_document_url;'
          if old_docs not in text and new_docs not in text:
              raise SystemExit('docsPending esperado não encontrado')
          text = text.replace(old_docs, new_docs)

          text = text.replace('activeRides[d.user_id] ?? null', 'activeRides[d.id] ?? null')
          text = text.replace('activeRides[detail.user_id] ?? null', 'activeRides[detail.id] ?? null')

          if 'activeRides[d.user_id]' in text or 'activeRides[detail.user_id]' in text:
              raise SystemExit('chave antiga de corrida ainda presente')
          if '|| !d.vehicle_photo_url' in text:
              raise SystemExit('foto do veículo ainda tratada como documento obrigatório')
          if 'activeRides[d.id] ?? null' not in text or 'activeRides[detail.id] ?? null' not in text:
              raise SystemExit('chave drivers.id não aplicada')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -F 'activeRides[d.id] ?? null' src/routes/admin.motoristas.tsx
          grep -F 'activeRides[detail.id] ?? null' src/routes/admin.motoristas.tsx
          ! grep -F '|| !d.vehicle_photo_url' src/routes/admin.motoristas.tsx
          grep -F 'return !d.selfie_url || !d.cnh_url || !d.cnh_back_url || !d.vehicle_document_url;' src/routes/admin.motoristas.tsx

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.motoristas.tsx
          git commit -m "fix(admin): alinhar estado e documentos do motorista"
          git push origin HEAD:feat/apois-admin-supabase-oficial-homologacao
