name: APOIS Motorista - runtime oficial

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-driver-runtime-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao

      - name: Aplicar patch
        run: python scripts/patch-apois-driver-runtime.py

      - name: Commit
        run: |
          git config user.name "APOIS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/motorista.app.tsx
          if git diff --cached --quiet; then
            echo "Nada para alterar"
            exit 0
          fi
          git commit -m "fix(motorista): usar contratos oficiais no runtime mobile"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
