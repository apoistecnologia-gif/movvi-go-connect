name: Build APOIS Motorista Homologacao

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apois-driver-homologation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build isolated driver SPA
        run: |
          npx vite build --mode mobile --config vite.driver-homologation.config.ts
          test -f dist/client/index.driver-homologation.html
          mv dist/client/index.driver-homologation.html dist/client/index.html
          test -f dist/client/index.html

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish APOIS Motorista homologation APK
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Motorista-Homologacao
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
