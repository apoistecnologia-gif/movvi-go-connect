name: Build APOIS Motorista Homologacao

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apois-driver-homologation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validar secret Google Maps da APOIS
        env:
          VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.APOIS_GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          if [ -z "$VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY" ]; then
            echo "Secret APOIS_GOOGLE_MAPS_BROWSER_KEY não configurado."
            exit 1
          fi
          echo "[maps-key] OK: secret da APOIS disponível para o build."

      # IMPORTANTE: usar o pipeline oficial do role motorista.
      # Ele gera o SPA mobile, recria android/ a partir de android-motorista/,
      # aplica capacitor.motorista.config.ts e executa as validações anti-regressão.
      - name: Build e sync oficial do APOIS Motorista
        env:
          VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.APOIS_GOOGLE_MAPS_BROWSER_KEY }}
        run: npm run android:motorista

      - name: Verificação nativa após sync
        run: node scripts/verify-mobile-native.mjs motorista --live

      - name: Confirmar configuração realmente empacotada
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path = 'android/app/src/main/assets/capacitor.config.json';
          const config = JSON.parse(readFileSync(path, 'utf8'));
          if (config.appId !== 'com.apois.motorista') {
            throw new Error(`appId empacotado incorreto: ${config.appId}`);
          }
          if (config.android?.initialFocus !== false) {
            throw new Error(`android.initialFocus empacotado precisa ser false; recebido: ${config.android?.initialFocus}`);
          }
          if (config.android?.captureInput !== false) {
            throw new Error(`android.captureInput empacotado precisa ser false; recebido: ${config.android?.captureInput}`);
          }
          console.log('[apk-config] OK: configuração nativa oficial do Motorista foi empacotada.');
          NODE

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish APOIS Motorista homologation APK
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Motorista-Homologacao
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
