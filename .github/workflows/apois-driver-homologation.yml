name: Build APOIS Motorista Homologacao

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apois-driver-homologation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restaurar assinatura estável de homologação
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: apois-motorista-homologacao-signing-v1

      - name: Garantir chave de homologação
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=APOIS Motorista Homologacao,O=APOIS,C=BR"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validar secret Google Maps da APOIS
        env:
          VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.APOIS_GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          if [ -z "$VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY" ]; then
            echo "Secret APOIS_GOOGLE_MAPS_BROWSER_KEY não configurado."
            exit 1
          fi
          echo "[maps-key] OK: secret da APOIS disponível para o build."

      - name: Preparar Firebase nativo do Motorista
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.APOIS_MOTORISTA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_CONFIG_B64" ]; then
            echo "NATIVE_PUSH_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Secret APOIS_MOTORISTA_GOOGLE_SERVICES_JSON_BASE64 ausente. O código será compilado, mas nenhum APK será publicado como candidato de homologação com push."
            exit 0
          fi
          printf '%s' "$FIREBASE_CONFIG_B64" | base64 --decode > android-motorista/app/google-services.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('android-motorista/app/google-services.json', 'utf8'));
          const projectId = String(config?.project_info?.project_id ?? '').trim();
          const packages = (config?.client ?? []).map((client) =>
            String(client?.client_info?.android_client_info?.package_name ?? '').trim(),
          );
          if (!projectId) throw new Error('Firebase project_id ausente.');
          if (!packages.includes('com.apois.motorista')) {
            throw new Error(`google-services.json não contém o cliente com.apois.motorista. Pacotes: ${packages.join(', ')}`);
          }
          console.log(`[firebase] OK: com.apois.motorista no projeto ${projectId}`);
          NODE
          echo "NATIVE_PUSH_READY=true" >> "$GITHUB_ENV"

      - name: Build e sync oficial do APOIS Motorista
        env:
          VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.APOIS_GOOGLE_MAPS_BROWSER_KEY }}
        run: VITE_ENABLE_NATIVE_PUSH="$NATIVE_PUSH_READY" npm run android:motorista

      - name: Verificação nativa após sync
        run: node scripts/verify-mobile-native.mjs motorista --live

      - name: Confirmar configuração realmente empacotada
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const path = 'android/app/src/main/assets/capacitor.config.json';
          const config = JSON.parse(readFileSync(path, 'utf8'));
          if (config.appId !== 'com.apois.motorista') {
            throw new Error(`appId empacotado incorreto: ${config.appId}`);
          }
          if (config.android?.initialFocus !== false) {
            throw new Error(`android.initialFocus empacotado precisa ser false; recebido: ${config.android?.initialFocus}`);
          }
          if (config.android?.captureInput !== false) {
            throw new Error(`android.captureInput empacotado precisa ser false; recebido: ${config.android?.captureInput}`);
          }
          const firebaseReady = process.env.NATIVE_PUSH_READY === 'true';
          if (firebaseReady && !existsSync('android/app/google-services.json')) {
            throw new Error('Firebase foi marcado como pronto, mas google-services.json não chegou ao projeto Android ativo.');
          }
          console.log(`[apk-config] OK: configuração nativa do Motorista empacotada; push=${firebaseReady ? 'ativo' : 'bloqueado por falta de Firebase'}.`);
          NODE

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Avisar bloqueio de homologação sem push
        if: ${{ env.NATIVE_PUSH_READY != 'true' }}
        run: |
          echo "::warning::Build técnico aprovado, porém o APK NÃO será publicado como candidato final porque o Firebase nativo do Motorista ainda não foi fornecido."

      - name: Publish APOIS Motorista homologation APK
        if: ${{ env.NATIVE_PUSH_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: APOIS-Motorista-Homologacao
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
