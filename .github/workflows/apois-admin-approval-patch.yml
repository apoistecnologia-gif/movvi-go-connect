name: APOIS Admin - corrigir aprovacao

on:
  push:
    branches:
      - feat/apois-admin-supabase-oficial-homologacao
    paths:
      - ".github/workflows/apois-admin-approval-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/apois-admin-supabase-oficial-homologacao

      - name: Aplicar patch
        run: python scripts/patch-admin-approval.py

      - name: Commit
        run: |
          git config user.name "APOIS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/admin.motoristas.tsx
          if git diff --cached --quiet; then
            echo "Nada para alterar"
            exit 0
          fi
          git commit -m "fix(admin): aprovar motorista direto no Supabase oficial"
          git push origin HEAD:feat/apois-admin-supabase-oficial-homologacao
