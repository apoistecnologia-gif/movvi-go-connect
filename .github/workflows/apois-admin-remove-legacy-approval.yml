name: APOIS Admin - remover aprovação legado

on:
  push:
    branches:
      - feat/apois-admin-supabase-oficial-homologacao
    paths:
      - ".github/workflows/apois-admin-remove-legacy-approval.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-admin-supabase-oficial-homologacao

      - name: Remover helper antigo de aprovação Mercado Pago
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/admin.motoristas.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('// Aprovação chama a Edge Function Mercado Pago via fetch autenticado.\n', '')

          type_start = text.find('type ApproveMercadoPagoResult = {')
          if type_start != -1:
              type_end = text.find('\n};', type_start)
              if type_end == -1:
                  raise SystemExit('fim de ApproveMercadoPagoResult não encontrado')
              text = text[:type_start] + text[type_end + 4:]

          fn_start = text.find('async function approveDriverWithMercadoPago(')
          if fn_start != -1:
              fn_end = text.find('\nasync function regenerateDriverCharge(', fn_start)
              if fn_end == -1:
                  raise SystemExit('fim de approveDriverWithMercadoPago não encontrado')
              text = text[:fn_start] + text[fn_end + 1:]

          if 'approve-driver-and-create-mercadopago-subscription' in text:
              raise SystemExit('referência antiga ainda presente')
          if 'approveDriverWithMercadoPago' in text:
              raise SystemExit('helper antigo ainda presente')
          if 'updateApprovalFn({' not in text or 'admin_set_driver_approval' in text:
              # admin_set_driver_approval fica encapsulado no server fn, não nesta rota.
              if 'updateApprovalFn({' not in text:
                  raise SystemExit('fluxo oficial de aprovação não encontrado')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar fluxo oficial
        run: |
          ! grep -F 'approve-driver-and-create-mercadopago-subscription' src/routes/admin.motoristas.tsx
          ! grep -F 'approveDriverWithMercadoPago' src/routes/admin.motoristas.tsx
          grep -F 'updateApprovalFn({' src/routes/admin.motoristas.tsx
          grep -F 'admin_set_driver_approval' src/lib/adminDrivers.functions.ts

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.motoristas.tsx
          git commit -m "fix(admin): remover aprovação legado Mercado Pago"
          git push origin HEAD:feat/apois-admin-supabase-oficial-homologacao
