name: APOIS Motorista - total km na oferta

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-motorista-offer-total-km-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao
      - name: Mostrar soma total de km
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/motorista.app.tsx')
          s=p.read_text()
          anchor='''  const pickupMin = pickupKm != null ? Math.max(1, Math.round((pickupKm / 32) * 60)) : null;\n\n  const cat ='''
          replacement='''  const pickupMin = pickupKm != null ? Math.max(1, Math.round((pickupKm / 32) * 60)) : null;\n  const tripKm = ride.distance_km != null ? Number(ride.distance_km) : null;\n  const totalKm = pickupKm != null && tripKm != null ? pickupKm + tripKm : null;\n\n  const cat ='''
          if 'const totalKm =' not in s:
            if anchor not in s: raise RuntimeError('ancora total km nao encontrada')
            s=s.replace(anchor,replacement,1)

          old='''          {/* Pagamento */}\n          <div className="mt-2.5 mb-2 flex items-center justify-between rounded-2xl border border-border bg-background/40 px-4 py-2">\n            <span className="text-[11px] font-medium uppercase tracking-[0.12em] text-muted-foreground">Pagamento</span>\n            <span className="text-[13px] font-semibold text-foreground">{paymentLabelFor(ride.payment_method)}</span>\n          </div>'''
          new='''          {/* Total de deslocamento + pagamento */}\n          <div className="mt-2.5 grid grid-cols-2 gap-2">\n            <div className="rounded-2xl border border-[#F6BE1C]/20 bg-[#F6BE1C]/8 px-3 py-2">\n              <span className="block text-[9px] font-black uppercase tracking-[0.12em] text-[#F6BE1C]">Km total</span>\n              <span className="mt-0.5 block text-[13px] font-black tabular-nums text-foreground">\n                {totalKm != null ? `${totalKm.toFixed(1)} km` : "—"}\n              </span>\n            </div>\n            <div className="rounded-2xl border border-border bg-background/40 px-3 py-2 text-right">\n              <span className="block text-[9px] font-medium uppercase tracking-[0.12em] text-muted-foreground">Pagamento</span>\n              <span className="mt-0.5 block truncate text-[12px] font-semibold text-foreground">{paymentLabelFor(ride.payment_method)}</span>\n            </div>\n          </div>'''
          if 'Km total' not in s:
            if old not in s: raise RuntimeError('bloco pagamento nao encontrado')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validar
        run: |
          grep -F 'const totalKm =' src/routes/motorista.app.tsx
          grep -F 'Km total' src/routes/motorista.app.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/motorista.app.tsx
          git commit -m "feat(motorista): exibir km total na oferta"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
