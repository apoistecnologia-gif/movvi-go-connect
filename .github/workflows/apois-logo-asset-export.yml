name: Export APOIS user-supplied circular icon for sibling portals
on:
  push:
    branches: [fix/apois-admin-desktop-login-logo-20261027]
    paths:
      - .github/workflows/apois-logo-asset-export.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact image and expose only public brand icon for companion portal
        shell: bash
        run: |
          set -euo pipefail
          test -s public/apois-official-circular-2026.webp
          file public/apois-official-circular-2026.webp
          printf 'APOIS_PUBLIC_BRAND_B64='
          base64 -w0 public/apois-official-circular-2026.webp
          printf '\n'
