name: APOIS Motorista - identidade historico

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-motorista-history-id-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao
      - name: Corrigir drivers.id no histórico
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/motorista.corridas.tsx')
          s=p.read_text()
          anchor='import { supabase } from "@/integrations/supabase/client";'
          if 'loadDriverProfile' not in s:
            if anchor not in s: raise RuntimeError('import supabase nao encontrado')
            s=s.replace(anchor,anchor+'\nimport { loadDriverProfile } from "@/lib/driverProfile";',1)

          old='''      const { data: auth } = await supabase.auth.getUser();\n      const uid = auth?.user?.id;\n      if (!uid) {\n        if (active) setRides([]);\n        return;\n      }\n      const { data, error } = await supabase\n        .from("rides")\n        .select(\n          "id,status,category,payment_method,passenger_photo_url,origin_name,destination_name,final_price,estimated_price,distance_km,duration_min,completed_at,created_at,accepted_at,passenger_rating,passenger_rating_comment,driver_rated_at",\n        )\n        .eq("driver_id", uid)'''
          new='''      const profile = await loadDriverProfile();\n      if (!profile.ok) {\n        if (active) setRides([]);\n        return;\n      }\n      const driverId = profile.profile.id;\n      const { data, error } = await supabase\n        .from("rides")\n        .select(\n          "id,status,category,payment_method,passenger_photo_url,origin_name,destination_name,final_price,estimated_price,distance_km,duration_min,completed_at,created_at,accepted_at,passenger_rating,passenger_rating_comment,driver_rated_at",\n        )\n        .eq("driver_id", driverId)'''
          if old not in s: raise RuntimeError('consulta antiga do historico nao encontrada')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validar
        run: |
          grep -F 'const driverId = profile.profile.id;' src/routes/motorista.corridas.tsx
          if grep -F '.eq("driver_id", uid)' src/routes/motorista.corridas.tsx; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/motorista.corridas.tsx
          git commit -m "fix(motorista): usar id real no histórico"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
