name: APOIS Driver — Current Format Artifact

on:
  push:
    branches:
      - tooling/apois-driver-lint-fix-current
    paths:
      - ".github/workflows/apois-driver-current-format-artifact.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format target only
        run: npx prettier --write src/apois-driver-homologation.tsx
      - name: Validate target
        run: npx eslint src/apois-driver-homologation.tsx
      - name: Verify only formatting changed
        run: git diff --check
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: apois-driver-formatted-source
          path: src/apois-driver-homologation.tsx
          if-no-files-found: error
          retention-days: 1
