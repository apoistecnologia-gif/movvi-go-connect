name: APOIS Admin - documentos motorista

on:
  push:
    branches:
      - feat/apois-admin-supabase-oficial-homologacao
    paths:
      - ".github/workflows/apois-admin-driver-docs-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-admin-supabase-oficial-homologacao
      - run: python scripts/patch-admin-driver-docs.py
      - name: Commit
        run: |
          git config user.name "APOIS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/admin.motoristas.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(admin): exibir todos os documentos do motorista"
          git push origin HEAD:feat/apois-admin-supabase-oficial-homologacao
