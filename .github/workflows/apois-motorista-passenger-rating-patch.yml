name: APOIS Motorista - nota do passageiro

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-motorista-passenger-rating-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao
      - name: Exibir nota real do passageiro
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/motorista.app.tsx')
          s = p.read_text()

          old_type = 'type Passenger = { name: string | null; phone: string | null; avatar_url: string | null };'
          new_type = '''type Passenger = {\n  name: string | null;\n  phone: string | null;\n  avatar_url: string | null;\n  average_rating: number | null;\n  total_ratings: number | null;\n};\n\nfunction passengerRatingText(passenger: Passenger | null, digits = 1) {\n  const value = passenger?.average_rating == null ? 5 : Number(passenger.average_rating);\n  return (Number.isFinite(value) ? value : 5).toFixed(digits);\n}'''
          assert old_type in s
          s = s.replace(old_type, new_type, 1)

          old_fetch = 'supabase.from("users").select("name, phone, avatar_url").eq("id", pid).maybeSingle()\n      .then(({ data }) => setPassenger(data ?? { name: null, phone: null, avatar_url: null }));'
          new_fetch = 'supabase.from("users").select("name, phone, avatar_url, average_rating, total_ratings").eq("id", pid).maybeSingle()\n      .then(({ data }) => setPassenger(data ?? { name: null, phone: null, avatar_url: null, average_rating: 5, total_ratings: 0 }));'
          assert old_fetch in s
          s = s.replace(old_fetch, new_fetch, 1)

          old_rating = '''  const rating = (passenger as { rating?: number | null } | null)?.rating;\n  const ratingText = rating != null ? Number(rating).toFixed(2) : "5.00";'''
          new_rating = '  const ratingText = passengerRatingText(passenger, 2);'
          assert old_rating in s
          s = s.replace(old_rating, new_rating, 1)

          s = s.replace('<Star className="h-3.5 w-3.5 fill-yellow-400 text-yellow-400" /> 5.0', '<Star className="h-3.5 w-3.5 fill-yellow-400 text-yellow-400" /> {passengerRatingText(passenger)}')
          s = s.replace('<Star className="h-3 w-3 fill-yellow-400 text-yellow-400" /> 5.0', '<Star className="h-3 w-3 fill-yellow-400 text-yellow-400" /> {passengerRatingText(passenger)}')

          p.write_text(s)
          PY
      - name: Validar patch
        run: |
          grep -q 'average_rating, total_ratings' src/routes/motorista.app.tsx
          grep -q 'passengerRatingText(passenger, 2)' src/routes/motorista.app.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/motorista.app.tsx
          git commit -m "feat(motorista): exibir nota real do passageiro"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
