name: APOIS Motorista - boas vindas

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-driver-welcome-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao
      - run: python scripts/patch-apois-driver-welcome.py
      - name: Commit
        run: |
          git config user.name "APOIS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/index.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(motorista): criar boas-vindas no layout APOIS"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
