name: APOIS Admin - validação

on:
  push:
    branches:
      - feat/apois-admin-supabase-oficial-homologacao
    paths:
      - "src/routes/admin.**"
      - "src/lib/admin**"
      - "src/lib/driverDocs.functions.ts"
      - "src/integrations/supabase/types.ts"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/apois-admin-validate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/admin.**"
      - "src/lib/admin**"
      - "src/lib/driverDocs.functions.ts"
      - "src/integrations/supabase/types.ts"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/apois-admin-validate.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_ID: ci_validation_project
      SUPABASE_URL: https://ci-validation.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci_validation_publishable_key
      VITE_SUPABASE_PROJECT_ID: ci_validation_project
      VITE_SUPABASE_URL: https://ci-validation.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci_validation_publishable_key
      VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ci_validation_maps_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar ambiente canônico APOIS
        run: |
          set -euo pipefail
          if [ -f .env ]; then
            echo '.env não pode ser versionado no Admin.'
            exit 1
          fi
          grep -qF 'project_id = "vqtucstyduxrqjgyigfk"' supabase/config.toml
          grep -qF 'PostgrestVersion: "14.15"' src/integrations/supabase/types.ts

          if grep -qE 'ekddifjpbieuainvjlbl|wqbtnfbvqtkyywfcqjwa|zjphbuvcapwyuynadgdt' supabase/config.toml .env.example; then
            echo 'Referência Supabase legada em configuração ativa do Admin.'
            exit 1
          fi

          grep -qF 'MERCADOPAGO_ACCESS_TOKEN=<SERVER_ONLY_SECRET>' .env.example
          grep -qF 'MERCADOPAGO_WEBHOOK_SECRET=<SERVER_ONLY_SECRET>' .env.example
          grep -qF 'ASAAS_API_KEY=<SERVER_ONLY_SECRET>' .env.example
          grep -qF 'ASAAS_WEBHOOK_TOKEN=<SERVER_ONLY_SECRET>' .env.example
          grep -qF 'FIREBASE_SERVICE_ACCOUNT_JSON=<SERVER_ONLY_SECRET>' .env.example

          if grep -qE 'sb_secret_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' .env.example; then
            echo 'Template de ambiente contém possível segredo real.'
            exit 1
          fi
          echo 'APOIS_ADMIN_ENV_OK'

      - name: Validar aprovação oficial do motorista
        run: |
          ! grep -F 'approve-driver-and-create-mercadopago-subscription' src/routes/admin.motoristas.tsx
          ! grep -F 'approveDriverWithMercadoPago' src/routes/admin.motoristas.tsx
          ! grep -F 'regenerate-driver-mercadopago-charge' src/routes/admin.motoristas.tsx
          ! grep -F 'onGenerateCharge' src/routes/admin.motoristas.tsx
          grep -F 'updateApprovalFn({' src/routes/admin.motoristas.tsx
          grep -F 'admin_set_driver_approval' src/lib/adminDrivers.functions.ts
          grep -F 'onSubscription' src/routes/admin.motoristas.tsx

      - name: Validar identidade operacional e documentos
        run: |
          grep -F 'activeRides[d.id] ?? null' src/routes/admin.motoristas.tsx
          grep -F 'activeRides[detail.id] ?? null' src/routes/admin.motoristas.tsx
          ! grep -F 'activeRides[d.user_id]' src/routes/admin.motoristas.tsx
          ! grep -F '|| !d.vehicle_photo_url' src/routes/admin.motoristas.tsx
          grep -F 'return !d.selfie_url || !d.cnh_url || !d.cnh_back_url || !d.vehicle_document_url;' src/routes/admin.motoristas.tsx

      - name: Validar contrato canônico de tarifas
        run: |
          ! grep -E 'category_key|field_key' src/routes/admin.precos.tsx src/lib/adminPricing.functions.ts
          grep -F 'category_id' src/routes/admin.precos.tsx
          grep -F 'base_fare' src/routes/admin.precos.tsx
          grep -F 'dynamic_multiplier' src/routes/admin.precos.tsx
          grep -F 'admin_is_authorized' src/lib/adminPricing.functions.ts
          grep -F 'admin_upsert_tariff_rule' src/lib/adminPricing.functions.ts
          grep -F "private.has_permission('users.manage')" supabase/migrations/20260808112000_admin_canonical_tariff_rpc.sql
          ! grep -Ei '^[[:space:]]*(drop|truncate|delete)[[:space:]]' supabase/migrations/20260808112000_admin_canonical_tariff_rpc.sql

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build do painel
        run: npm run build
