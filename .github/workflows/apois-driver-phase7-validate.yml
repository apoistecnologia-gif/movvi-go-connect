name: APOIS Corridas — Driver Phase 7

on:
  push:
    branches:
      - fix/apois-corridas-consolidacao
    paths:
      - "src/routes/motorista*.tsx"
      - "src/lib/driver*.ts"
      - "src/lib/notifications/**"
      - "src/lib/nativeBridge.ts"
      - "src/lib/appRole.ts"
      - "src/components/AuthShell.tsx"
      - "src/components/MovviLogo.tsx"
      - "src/assets/apoisLogoData.ts"
      - "android/**"
      - "android-motorista/**"
      - "capacitor.config*.ts"
      - "vite.mobile.config.ts"
      - "scripts/verify-mobile-native.mjs"
      - "supabase/baseline/00[0-9]_*.sql"
      - "supabase/baseline/010_*.sql"
      - "supabase/functions/dispatch-ride/**"
      - "supabase/functions/send-ride-push/**"
      - "tests/driver/**"
      - "tests/database/driver_experience.sh"
      - "tsconfig.driver-phase7.json"
      - "package.json"
      - ".github/workflows/apois-driver-phase7-validate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/routes/motorista*.tsx"
      - "src/lib/driver*.ts"
      - "src/lib/notifications/**"
      - "src/lib/nativeBridge.ts"
      - "src/lib/appRole.ts"
      - "src/components/AuthShell.tsx"
      - "src/components/MovviLogo.tsx"
      - "src/assets/apoisLogoData.ts"
      - "android/**"
      - "android-motorista/**"
      - "capacitor.config*.ts"
      - "vite.mobile.config.ts"
      - "scripts/verify-mobile-native.mjs"
      - "supabase/baseline/00[0-9]_*.sql"
      - "supabase/baseline/010_*.sql"
      - "supabase/functions/dispatch-ride/**"
      - "supabase/functions/send-ride-push/**"
      - "tests/driver/**"
      - "tests/database/driver_experience.sh"
      - "tsconfig.driver-phase7.json"
      - "package.json"
      - ".github/workflows/apois-driver-phase7-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apois-driver-phase7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apois_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apois_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: apois_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply canonical baseline through Phase 7
        run: |
          set -euo pipefail
          for file in \
            supabase/baseline/000_ci_prelude.sql \
            supabase/baseline/001_canonical_schema.sql \
            supabase/baseline/002_functions.sql \
            supabase/baseline/003_rls.sql \
            supabase/baseline/004_storage_triggers_seed.sql \
            supabase/baseline/005_security_hardening.sql \
            supabase/baseline/006_dispatch_atomic_accept.sql \
            supabase/baseline/007_financial_settlement.sql \
            supabase/baseline/008_financial_hardening.sql \
            supabase/baseline/009_passenger_experience.sql \
            supabase/baseline/010_driver_experience.sql; do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Driver backend integration tests
        run: bash tests/database/driver_experience.sh

      - name: Driver security invariants
        run: |
          set -euo pipefail
          anon_docs=$(psql -Atqc "select has_function_privilege('anon','public.driver_update_document(text,text)','EXECUTE')::int")
          auth_docs=$(psql -Atqc "select has_function_privilege('authenticated','public.driver_update_document(text,text)','EXECUTE')::int")
          anon_finance=$(psql -Atqc "select has_function_privilege('anon','public.get_driver_financial_dashboard(timestamptz,timestamptz)','EXECUTE')::int")
          auth_finance=$(psql -Atqc "select has_function_privilege('authenticated','public.get_driver_financial_dashboard(timestamptz,timestamptz)','EXECUTE')::int")
          anon_withdraw=$(psql -Atqc "select has_function_privilege('anon','public.driver_request_withdrawal(bigint,uuid)','EXECUTE')::int")
          auth_withdraw=$(psql -Atqc "select has_function_privilege('authenticated','public.driver_request_withdrawal(bigint,uuid)','EXECUTE')::int")
          test "$anon_docs" = "0"
          test "$auth_docs" = "1"
          test "$anon_finance" = "0"
          test "$auth_finance" = "1"
          test "$anon_withdraw" = "0"
          test "$auth_withdraw" = "1"
          echo 'APOIS_DRIVER_BACKEND_PHASE7_OK'

  driver-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Phase 7 contract tests
        run: node tests/driver/phase7-contract.mjs

      - name: TypeScript — Phase 7 Driver surface
        run: npx tsc --noEmit --project tsconfig.driver-phase7.json

      - name: ESLint — Phase 7 Driver surface
        run: |
          npx eslint \
            src/lib/driverDocuments.mobile.ts \
            src/lib/driverFinance.mobile.ts \
            src/lib/driverRideLifecycle.mobile.ts \
            src/lib/nativeBridge.ts \
            src/lib/notifications/deviceTokenService.ts \
            src/routes/motorista.documentos.tsx \
            src/routes/motorista.ganhos.tsx

      - name: Prepare Firebase Driver client
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.APOIS_MOTORISTA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -f android-motorista/app/google-services.json ]; then
            echo '[firebase] using checked-in APOIS Driver config'
          elif [ -n "$FIREBASE_CONFIG_B64" ]; then
            printf '%s' "$FIREBASE_CONFIG_B64" | base64 --decode > android-motorista/app/google-services.json
            echo '[firebase] using repository secret fallback'
          else
            echo 'Firebase client for com.apois.motorista is required for Phase 7 native push validation.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('android-motorista/app/google-services.json', 'utf8'));
          const packages = (config?.client ?? []).map((client) => String(client?.client_info?.android_client_info?.package_name ?? '').trim());
          if (!packages.includes('com.apois.motorista')) throw new Error(`Firebase client missing com.apois.motorista: ${packages.join(', ')}`);
          console.log('[firebase] com.apois.motorista OK');
          NODE

      - name: Build and sync APOIS Driver
        env:
          VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.APOIS_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_ENABLE_NATIVE_PUSH: "true"
        run: |
          set -euo pipefail
          test -n "$VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY"
          npm run android:motorista

      - name: Verify native Driver shell
        run: node scripts/verify-mobile-native.mjs motorista --live

      - name: Build Driver APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Native push and background-location gate
        run: |
          set -euo pipefail
          grep -F 'PushNotifications.register' src/lib/nativeBridge.ts
          grep -F 'registerDeviceToken' src/lib/nativeBridge.ts
          grep -F 'rpc("register_notification_token"' src/lib/notifications/deviceTokenService.ts
          grep -F 'startForegroundService' android-motorista/app/src/main/java/com/apois/motorista/DriverLocationPlugin.java
          grep -F 'driver_set_presence' android-motorista/app/src/main/java/com/apois/motorista/DriverLocationService.java
          grep -F '/functions/v1/send-ride-push' supabase/functions/dispatch-ride/index.ts
          echo 'APOIS_DRIVER_MOBILE_PHASE7_OK'
