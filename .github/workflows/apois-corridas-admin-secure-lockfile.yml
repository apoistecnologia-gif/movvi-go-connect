name: APOIS Corridas Admin - Corrigir dependencias e validar
on:
  push:
    branches:
      - fix/apois-corridas-admin-secure-deploy-20261027
    paths:
      - .github/workflows/apois-corridas-admin-secure-lockfile.yml
      - package.json
      - src/components/routing/DefaultBoundaries.tsx
      - src/routes/__root.tsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-safe-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout safe deployment branch
        uses: actions/checkout@v4
        with:
          ref: fix/apois-corridas-admin-secure-deploy-20261027
          persist-credentials: true
      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Rebuild lockfile with patched dependencies
        run: |
          set -euo pipefail
          bun install --lockfile-only
          grep -Fq '"@tanstack/react-start@1.168.60"' bun.lock
          grep -Fq '"@tanstack/start-server-core@1.169.39"' bun.lock
          if grep -Eq '"@tanstack/react-start@1\.168\.[0-5][0-9]"' bun.lock; then
            echo "::error::Old vulnerable TanStack Start remains in lockfile"
            exit 1
          fi
          echo "[OK] Security lockfile upgraded and verified"
      - name: Install exact lockfile and validate types
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
      - name: Commit safe lockfile on isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): regenerate Bun lockfile with patched TanStack packages"
            git push origin HEAD:fix/apois-corridas-admin-secure-deploy-20261027
          fi
          echo "[OK] Secure reproducible dependencies committed"
