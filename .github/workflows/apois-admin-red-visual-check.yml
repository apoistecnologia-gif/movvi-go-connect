name: APOIS Corridas Admin - Visual Brand Gate
on:
  push:
    branches:
      - fix/apois-admin-visual-red-20261027
      - fix/apois-admin-desktop-login-logo-20261027
      - fix/apois-admin-recovery-20261028
    paths:
      - .github/workflows/apois-admin-red-visual-check.yml
      - src/**
      - public/apois-official-circular-2026.webp
      - scripts/verify-apois-admin-red-brand.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Pinned patched dependencies
        run: bun install --frozen-lockfile
      - name: Visual brand and functional-preservation guards
        run: node scripts/verify-apois-admin-red-brand.mjs
      - name: Verify the public user-supplied APOIS logo and desktop-only Admin login
        run: |
          set -euo pipefail
          grep -Fq "data:image/png;base64,iVBORw0KGgo" src/assets/apoisOfficial2026.ts
          grep -Fq "data-apois-admin-desktop-login" src/routes/admin.login.tsx
          grep -Fq 'src={APOIS_OFFICIAL_RED_LOGO_URL}' src/routes/admin.login.tsx
          grep -Fq 'src={APOIS_OFFICIAL_RED_LOGO_URL}' src/components/admin/AdminSidebar.tsx
          if grep -Fq "<AuthShell" src/routes/admin.login.tsx; then exit 1; fi
          echo "[OK] Official uploaded circular brand and corporate web login present"
      - name: Typecheck
        run: bun run typecheck
      - name: Build web panel
        run: bun run build
      - name: No production changes
        run: echo "[OK] Admin visual migration tested in isolated branch."
