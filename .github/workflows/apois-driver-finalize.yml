name: Finalizar APOIS Motorista

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - .github/workflows/apois-driver-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ajustar patch à versão atual da oferta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apois-driver-finalize.mjs')
          s = p.read_text()
          s = s.replace(
              'className="shrink-0 border-t border-white/5 bg-[#08090A] px-4 pt-3"',
              'className="shrink-0 border-t border-border/60 bg-card px-4 pt-3 sm:px-5"',
          )
          p.write_text(s)
          PY

      - name: Aplicar correções finais
        run: node .github/scripts/apois-driver-finalize.mjs

      - name: Corrigir tipos estritos detectados
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/MovviHeader.tsx')
          s = p.read_text()
          s = s.replace('const meta = (u.user.user_metadata ?? {}) as Record<string, unknown>;', 'const meta = (u.user_metadata ?? {}) as Record<string, unknown>;')
          p.write_text(s)

          p = Path('src/routes/motorista.app.tsx')
          s = p.read_text()
          s = s.replace('candidates.includes(userId)', 'candidates.includes(userId as string)')
          s = s.replace('rejected.includes(userId)', 'rejected.includes(userId as string)')
          s = s.replace('.contains("candidate_driver_ids", [userId])', '.contains("candidate_driver_ids", [userId as string])')
          s = s.replace('maneuver: s.maneuver,', 'maneuver: s.maneuver ?? undefined,')
          p.write_text(s)
          PY

      - name: Verificar diff
        run: git diff --check

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build mobile motorista
        env:
          VITE_APOIS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.APOIS_GOOGLE_MAPS_BROWSER_KEY }}
        run: npm run build:motorista

      - name: Commitar consolidação
        run: |
          git config user.name "APOIS Homologation Bot"
          git config user.email "apois-homologation@users.noreply.github.com"
          git add -A
          git commit -m "fix(motorista): consolidar homologação visual e funcional APOIS"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
