name: APOIS Motorista - limpeza de marca

on:
  push:
    branches:
      - feat/apois-motorista-producao-homologacao
    paths:
      - ".github/workflows/apois-motorista-brand-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/apois-motorista-producao-homologacao

      - name: Remover marca MOVVI do código visível do app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = []
          for pattern in ("*.ts", "*.tsx"):
              for path in Path("src").rglob(pattern):
                  text = path.read_text(encoding="utf-8")
                  updated = (
                      text
                      .replace("MOVVI DRIVE", "APOIS")
                      .replace("MOVVI Driver", "APOIS Motorista")
                      .replace("MOVVI", "APOIS")
                      .replace("movvi-corrida-", "apois-corrida-")
                  )
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")
                      changed.append(str(path))

          print("Arquivos alterados:")
          for item in changed:
              print(" -", item)
          PY

      - name: Garantir que não restou MOVVI em src
        run: |
          if grep -RIn --include='*.ts' --include='*.tsx' 'MOVVI' src; then
            echo 'Ainda existem referências MOVVI em src.'
            exit 1
          fi

      - name: Commit da limpeza
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor(motorista): remover marca MOVVI visível do app"
          git push origin HEAD:feat/apois-motorista-producao-homologacao
